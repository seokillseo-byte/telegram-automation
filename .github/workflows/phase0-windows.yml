name: Windows Desktop
on:
  push:
    branches: [main, phase-0-foundation-spike, industry-research-v0.1, group-channel-analysis-v0.2, phase-1-app-foundation, message-templates-v0.4, inbox-read-v0.5, inbox-live-v0.6, manual-send-v0.7]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Electron renderer and preload smoke
        run: pnpm smoke
      - name: Build Windows installer
        run: pnpm dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke packaged application
        run: node scripts/smoke.mjs "release/win-unpacked/Telegram Automation Phase 0.exe"
      - name: SHA-256 and installer size
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding utf8 "release/$($_.Name).sha256"
            "$($_.Name): $($_.Length) bytes" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-Industry-Research-Windows-x64
          path: |
            release/*.exe
            release/*.sha256
          if-no-files-found: error
          retention-days: 14
